<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence - 原型设计稿</title>
    <style>
      /* ========== Reset & Base ========== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #0b0b0b;
        --bg-tertiary: #101010;
        --border-color: rgba(255, 255, 255, 0.1);
        --border-color-light: rgba(255, 255, 255, 0.08);
        --text-primary: #f5f5f5;
        --text-secondary: #a1a1aa;
        --text-muted: #525252;
        --accent: #8b5cf6;
        --accent-hover: #7c3aed;
        --subtitle-translation-active: #d4d4d4;
        --subtitle-hover-bg: rgba(255, 255, 255, 0.03);
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ========== Layout ========== */
      .app-container {
        display: grid;
        grid-template-columns: 1fr 360px;
        height: 100vh;
        overflow: hidden;
      }

      .app-container.sidebar-closed {
        grid-template-columns: 1fr;
      }

      .app-container.sidebar-closed .sidebar {
        display: none;
      }

      /* ========== Main Area ========== */
      .main-area {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--border-color);
        background: var(--bg-secondary);
      }

      /* ========== Video Area ========== */
      .video-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem 1.5rem 0;
      }

      .video-container {
        position: relative;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid #27272a;
        border-radius: 1rem;
        overflow: hidden;
        flex-shrink: 0;
      }

      .video-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        color: var(--text-muted);
      }

      .video-placeholder svg {
        opacity: 0.4;
      }

      .video-placeholder span {
        font-size: 1rem;
      }

      /* ========== Subtitle Display ========== */
      .subtitle-display {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.25rem 0;
        min-height: 9rem;
      }

      .subtitle-primary {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text-primary);
        max-width: 64rem;
      }

      .subtitle-secondary {
        margin-top: 1.25rem;
        font-size: 1.5rem;
        line-height: 1.4;
        color: var(--text-secondary);
        max-width: 64rem;
      }

      .subtitle-empty {
        font-size: 1.125rem;
        color: var(--text-muted);
      }

      /* ========== Controls Bar ========== */
      .controls-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.25rem;
        height: 3.5rem;
        padding: 0 1rem;
        border-top: 1px solid var(--border-color-light);
        background: var(--bg-secondary);
      }

      .control-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }

      .control-btn.active {
        color: var(--accent);
      }

      .control-btn.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }

      /* ========== Sidebar ========== */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-tertiary);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 3.5rem;
        padding: 0 2rem;
        border-bottom: 1px solid var(--border-color-light);
        flex-shrink: 0;
      }

      .sidebar-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      .sidebar-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .sidebar-close:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }

      /* ========== Subtitle List ========== */
      .subtitle-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1rem 1.25rem;
        scrollbar-width: thin;
        scrollbar-color: #4b4b4b transparent;
      }

      .subtitle-list::-webkit-scrollbar {
        width: 6px;
      }

      .subtitle-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .subtitle-list::-webkit-scrollbar-thumb {
        background: #4b4b4b;
        border-radius: 3px;
      }

      .subtitle-item {
        display: grid;
        grid-template-columns: 62px 1fr;
        gap: 0.25rem;
        width: 100%;
        padding: 0.5rem 0;
        border: none;
        background: transparent;
        border-radius: 0.375rem;
        text-align: left;
        cursor: pointer;
        transition: all 150ms ease;
        color: var(--text-muted);
      }

      .subtitle-item:hover {
        background: var(--subtitle-hover-bg);
        color: var(--text-secondary);
      }

      .subtitle-item.active {
        color: var(--accent);
      }

      .subtitle-item.active .subtitle-time {
        color: var(--accent);
      }

      .subtitle-item.active .subtitle-translation {
        color: var(--subtitle-translation-active);
      }

      .subtitle-time {
        font-size: 0.875rem;
        font-weight: 700;
        text-align: center;
        color: var(--text-muted);
        transition: color 150ms ease;
      }

      .subtitle-time:hover {
        color: var(--accent);
      }

      .subtitle-text {
        display: block;
        font-size: 0.875rem;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.01em;
      }

      .subtitle-translation {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        line-height: 1.4;
        letter-spacing: -0.01em;
        color: var(--text-muted);
        transition: color 150ms ease;
      }

      .sidebar-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      /* ========== Responsive ========== */
      @media (max-width: 1024px) {
        .app-container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main App Container -->
    <div class="app-container" id="app">
      <!-- Main Content Area -->
      <main class="main-area">
        <!-- Video Section -->
        <div class="video-section">
          <!-- Video Player -->
          <div class="video-container">
            <div class="video-placeholder">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              <span data-i18n="videoPlaceholder">选择视频文件开始播放</span>
            </div>
          </div>

          <!-- Subtitle Display Area -->
          <div class="subtitle-display">
            <!-- State 1: With subtitles (default) -->
            <div class="subtitle-content" id="subtitle-content">
              <p class="subtitle-primary">
                Welcome to Cadence, your local video player.
              </p>
              <p class="subtitle-secondary">
                欢迎使用 Cadence，您的本地视频播放器。
              </p>
            </div>
            <!-- State 2: Empty (hidden by default) -->
            <div
              class="subtitle-content"
              id="subtitle-empty"
              style="display: none"
            >
              <p class="subtitle-empty" data-i18n="noSubtitles">未加载字幕</p>
            </div>
          </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="controls-bar">
          <!-- Open Video Button -->
          <button
            class="control-btn"
            data-i18n-title="openVideo"
            onclick="
              document.getElementById('openVideoModal').style.display = 'flex'
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"
              />
            </svg>
          </button>

          <!-- Load Subtitle Button -->
          <button
            class="control-btn"
            data-i18n-title="loadSubtitle"
            onclick="
              document.getElementById('loadSubtitleModal').style.display =
                'flex'
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"
              />
              <path d="M14 2v4a2 2 0 0 0 2 2h4" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="13" y2="17" />
            </svg>
          </button>

          <!-- Toggle Sidebar Button -->
          <button
            id="sidebar-toggle-btn"
            class="control-btn active"
            data-i18n-title="subtitlesSidebar"
            onclick="toggleSidebar()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
              />
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
              <path d="M8 10h.01" />
              <path d="M12 10h.01" />
              <path d="M16 10h.01" />
              <path d="M8 14h.01" />
              <path d="M12 14h.01" />
              <path d="M16 14h.01" />
              <path d="M8 18h.01" />
              <path d="M12 18h.01" />
            </svg>
          </button>

          <!-- Settings Button -->
          <button
            class="control-btn"
            data-i18n-title="settings"
            onclick="
              document.getElementById('settingsModal').style.display = 'flex'
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>
      </main>

      <!-- Sidebar (Subtitle List) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
              />
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
            </svg>
            <span data-i18n="subtitlesList">字幕列表</span>
          </div>
          <button class="sidebar-close" onclick="toggleSidebar()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="subtitle-list" id="subtitleList">
          <!-- State 1: With subtitles (default) -->
          <div class="space-y-2" id="subtitle-list-content">
            <button class="subtitle-item" onclick="seekToSubtitle(0)">
              <span class="subtitle-time">00:00</span>
              <span>
                <span class="subtitle-text">Welcome to Cadence.</span>
                <span class="subtitle-translation">欢迎使用 Cadence。</span>
              </span>
            </button>

            <button class="subtitle-item active" onclick="seekToSubtitle(1)">
              <span class="subtitle-time">00:05</span>
              <span>
                <span class="subtitle-text"
                  >This is your local video player.</span
                >
                <span class="subtitle-translation"
                  >这是您的本地视频播放器。</span
                >
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(2)">
              <span class="subtitle-time">00:10</span>
              <span>
                <span class="subtitle-text"
                  >Support for SRT and ASS subtitle formats.</span
                >
                <span class="subtitle-translation"
                  >支持 SRT 和 ASS 字幕格式。</span
                >
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(3)">
              <span class="subtitle-time">00:15</span>
              <span>
                <span class="subtitle-text"
                  >Navigate subtitles with arrow keys.</span
                >
                <span class="subtitle-translation"
                  >使用方向键在字幕间跳转。</span
                >
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(4)">
              <span class="subtitle-time">00:20</span>
              <span>
                <span class="subtitle-text"
                  >Hard subtitle masking is supported.</span
                >
                <span class="subtitle-translation">支持硬字幕遮挡功能。</span>
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(5)">
              <span class="subtitle-time">00:25</span>
              <span>
                <span class="subtitle-text"
                  >Fine-tune subtitle timing with ease.</span
                >
                <span class="subtitle-translation">轻松微调字幕时间。</span>
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(6)">
              <span class="subtitle-time">00:30</span>
              <span>
                <span class="subtitle-text"
                  >Built with Tauri, React, and Tailwind CSS.</span
                >
                <span class="subtitle-translation"
                  >基于 Tauri、React 和 Tailwind CSS 构建。</span
                >
              </span>
            </button>

            <button class="subtitle-item" onclick="seekToSubtitle(7)">
              <span class="subtitle-time">00:35</span>
              <span>
                <span class="subtitle-text"
                  >Enjoy your viewing experience.</span
                >
                <span class="subtitle-translation">祝您观看愉快。</span>
              </span>
            </button>
          </div>

          <!-- State 2: Empty (hidden by default) -->
          <div
            class="sidebar-empty"
            id="sidebar-empty"
            style="display: none"
            data-i18n="noSubtitles"
          >
            未加载字幕
          </div>
        </div>
      </aside>
    </div>

    <!-- Open Video Modal -->
    <div
      id="openVideoModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 300;
      "
      onclick="this.style.display = 'none'"
    >
      <div
        style="
          background: #1a1a1a;
          border-radius: 1rem;
          padding: 2rem;
          max-width: 400px;
          width: 90%;
        "
        onclick="event.stopPropagation()"
      >
        <h3
          style="margin: 0 0 1rem; font-size: 1.25rem; font-weight: 600"
          data-i18n="openVideoTitle"
        >
          打开视频文件
        </h3>
        <p
          style="margin: 0 0 1.5rem; color: #a1a1aa; font-size: 0.875rem"
          data-i18n="openVideoDesc"
        >
          支持的视频格式：mp4, webm, mkv, avi, mov, flv, wmv
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end">
          <button
            onclick="this.closest('[id$=Modal]').style.display = 'none'"
            style="
              padding: 0.5rem 1rem;
              background: transparent;
              border: 1px solid #3f3f46;
              color: #a1a1aa;
              border-radius: 0.5rem;
              cursor: pointer;
              font-size: 0.875rem;
            "
          >
            <span data-i18n="cancel">取消</span>
          </button>
          <button
            onclick="this.closest('[id$=Modal]').style.display = 'none'"
            style="
              padding: 0.5rem 1rem;
              background: #8b5cf6;
              color: #0a0a0a;
              border: none;
              border-radius: 0.5rem;
              cursor: pointer;
              font-size: 0.875rem;
              font-weight: 500;
            "
          >
            <span data-i18n="selectFile">选择文件</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Load Subtitle Modal -->
    <div
      id="loadSubtitleModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 300;
      "
      onclick="this.style.display = 'none'"
    >
      <div
        style="
          background: #1a1a1a;
          border-radius: 1rem;
          padding: 2rem;
          max-width: 400px;
          width: 90%;
        "
        onclick="event.stopPropagation()"
      >
        <h3
          style="margin: 0 0 1rem; font-size: 1.25rem; font-weight: 600"
          data-i18n="loadSubtitleTitle"
        >
          加载字幕文件
        </h3>
        <p
          style="margin: 0 0 1.5rem; color: #a1a1aa; font-size: 0.875rem"
          data-i18n="loadSubtitleDesc"
        >
          支持的字幕格式：SRT, ASS
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end">
          <button
            onclick="this.closest('[id$=Modal]').style.display = 'none'"
            style="
              padding: 0.5rem 1rem;
              background: transparent;
              border: 1px solid #3f3f46;
              color: #a1a1aa;
              border-radius: 0.5rem;
              cursor: pointer;
              font-size: 0.875rem;
            "
          >
            <span data-i18n="cancel">取消</span>
          </button>
          <button
            onclick="this.closest('[id$=Modal]').style.display = 'none'"
            style="
              padding: 0.5rem 1rem;
              background: #8b5cf6;
              color: #0a0a0a;
              border: none;
              border-radius: 0.5rem;
              cursor: pointer;
              font-size: 0.875rem;
              font-weight: 500;
            "
          >
            <span data-i18n="selectFile">选择文件</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div
      id="settingsModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 300;
      "
      onclick="this.style.display = 'none'"
    >
      <div
        id="settingsModalInner"
        style="
          background: #1a1a1a;
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 1rem;
          padding: 0;
          max-width: 420px;
          width: 90%;

    <script>
      // Toggle sidebar visibility
      function toggleSidebar() {
        const app = document.getElementById("app");
        const btn = document.getElementById("sidebar-toggle-btn");
        const isClosed = app.classList.toggle("sidebar-closed");
        if (isClosed) {
          btn.classList.remove("active");
        } else {
          btn.classList.add("active");
        }
      }

      // Simulate seeking to subtitle
      function seekToSubtitle(index) {
        const items = document.querySelectorAll(".subtitle-item");
        items.forEach((item, i) => {
          item.classList.toggle("active", i === index);
        });

        // Update subtitle display
        const texts = [
          ["Welcome to Cadence.", "欢迎使用 Cadence。"],
          ["This is your local video player.", "这是您的本地视频播放器。"],
          [
            "Support for SRT and ASS subtitle formats.",
            "支持 SRT 和 ASS 字幕格式。",
          ],
          ["Navigate subtitles with arrow keys.", "使用方向键在字幕间跳转。"],
          ["Hard subtitle masking is supported.", "支持硬字幕遮挡功能。"],
          ["Fine-tune subtitle timing with ease.", "轻松微调字幕时间。"],
          [
            "Built with Tauri, React, and Tailwind CSS.",
            "基于 Tauri、React 和 Tailwind CSS 构建。",
          ],
          ["Enjoy your viewing experience.", "祝您观看愉快。"],
        ];

        document.querySelector(".subtitle-primary").textContent =
          texts[index][0];
        document.querySelector(".subtitle-secondary").textContent =
          texts[index][1];

        // Scroll active item into view
        items[index].scrollIntoView({ behavior: "smooth", block: "center" });
      }

      // Get current active subtitle index
      function getActiveIndex() {
        const items = document.querySelectorAll(".subtitle-item");
        for (let i = 0; i < items.length; i++) {
          if (items[i].classList.contains("active")) return i;
        }
        return null;
      }

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          const items = document.querySelectorAll(".subtitle-item");
          if (items.length === 0) return;

          let idx = getActiveIndex();
          if (idx === null) idx = 0;

          if (e.key === "ArrowLeft") {
            idx = Math.max(0, idx - 1);
          } else {
            idx = Math.min(items.length - 1, idx + 1);
          }

          seekToSubtitle(idx);
        }
      });

      // --- i18n ---
      const i18n = {
        zh: {
          videoPlaceholder: "选择视频文件开始播放",
          noSubtitles: "未加载字幕",
          openVideo: "打开视频",
          loadSubtitle: "加载字幕",
          subtitlesSidebar: "字幕侧边栏",
          settings: "设置",
          subtitlesList: "字幕列表",
          openVideoTitle: "打开视频文件",
          openVideoDesc: "支持的视频格式：mp4, webm, mkv, avi, mov, flv, wmv",
          loadSubtitleTitle: "加载字幕文件",
          loadSubtitleDesc: "支持的字幕格式：SRT, ASS",
          cancel: "取消",
          selectFile: "选择文件",
          language: "语言",
          theme: "主题",
          checkUpdate: "检查更新",
          version: "版本",
          checking: "检查中...",
          upToDate: "已是最新版本",
          langZh: "中文",
          langEn: "English",
          themeDark: "暗色",
          themeLight: "亮色",
        },
        en: {
          videoPlaceholder: "Select a video file to start playback",
          noSubtitles: "No subtitles loaded",
          openVideo: "Open Video",
          loadSubtitle: "Load Subtitle",
          subtitlesSidebar: "Subtitle Sidebar",
          settings: "Settings",
          subtitlesList: "Subtitles",
          openVideoTitle: "Open Video File",
          openVideoDesc:
            "Supported video formats: mp4, webm, mkv, avi, mov, flv, wmv",
          loadSubtitleTitle: "Load Subtitle File",
          loadSubtitleDesc: "Supported subtitle formats: SRT, ASS",
          cancel: "Cancel",
          selectFile: "Select File",
          language: "Language",
          theme: "Theme",
          checkUpdate: "Check for Updates",
          version: "Version",
          checking: "Checking...",
          upToDate: "Up to date",
          langZh: "中文",
          langEn: "English",
          themeDark: "Dark",
          themeLight: "Light",
        },
      };

      let currentLang = "zh";

      function applyLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];

        // Update text content
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) el.textContent = t[key];
        });

        // Update title attributes
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.getAttribute("data-i18n-title");
          if (t[key]) el.setAttribute("title", t[key]);
        });

        // Update lang button texts
        const zhBtn = document.getElementById("lang-zh");
        const enBtn = document.getElementById("lang-en");
        if (zhBtn) zhBtn.textContent = t.langZh;
        if (enBtn) enBtn.textContent = t.langEn;

        // Update theme button texts
        const darkBtn = document.getElementById("theme-dark");
        const lightBtn = document.getElementById("theme-light");
        if (darkBtn) {
          darkBtn.childNodes[darkBtn.childNodes.length - 1].textContent =
            " " + t.themeDark;
        }
        if (lightBtn) {
          lightBtn.childNodes[lightBtn.childNodes.length - 1].textContent =
            " " + t.themeLight;
        }

        // Update check update status text if visible
        const status = document.getElementById("updateStatus");
        if (status) {
          if (
            status.textContent === "检查中..." ||
            status.textContent === "Checking..."
          ) {
            status.textContent = t.checking;
          } else if (
            status.textContent === "已是最新版本" ||
            status.textContent === "Up to date"
          ) {
            status.textContent = t.upToDate;
          }
        }
      }

      // Switch language
      function switchLang(lang) {
        const zhBtn = document.getElementById("lang-zh");
        const enBtn = document.getElementById("lang-en");

        if (lang === "zh") {
          zhBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          enBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        } else {
          zhBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          enBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        }

        applyLanguage(lang);
      }

      // Switch theme
      function switchTheme(theme) {
        const darkBtn = document.getElementById("theme-dark");
        const lightBtn = document.getElementById("theme-light");
        const root = document.documentElement;

        if (theme === "dark") {
          darkBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          lightBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          root.style.setProperty("--bg-primary", "#0a0a0a");
          root.style.setProperty("--bg-secondary", "#0b0b0b");
          root.style.setProperty("--bg-tertiary", "#101010");
          root.style.setProperty("--border-color", "rgba(255, 255, 255, 0.1)");
          root.style.setProperty(
            "--border-color-light",
            "rgba(255, 255, 255, 0.08)",
          );
          root.style.setProperty("--text-primary", "#f5f5f5");
          root.style.setProperty("--text-secondary", "#a1a1aa");
          root.style.setProperty("--text-muted", "#525252");
          root.style.setProperty("--subtitle-translation-active", "#d4d4d4");
          root.style.setProperty(
            "--subtitle-hover-bg",
            "rgba(255, 255, 255, 0.03)",
          );
          // Update settings modal
          updateSettingsModalTheme("dark");
        } else {
          lightBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          darkBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          root.style.setProperty("--bg-primary", "#fafafa");
          root.style.setProperty("--bg-secondary", "#ffffff");
          root.style.setProperty("--bg-tertiary", "#f4f4f5");
          root.style.setProperty("--border-color", "rgba(0, 0, 0, 0.1)");
          root.style.setProperty("--border-color-light", "rgba(0, 0, 0, 0.06)");
          root.style.setProperty("--text-primary", "#18181b");
          root.style.setProperty("--text-secondary", "#525252");
          root.style.setProperty("--text-muted", "#a1a1aa");
          root.style.setProperty("--subtitle-translation-active", "#3f3f46");
          root.style.setProperty("--subtitle-hover-bg", "rgba(0, 0, 0, 0.04)");
          // Update settings modal
          updateSettingsModalTheme("light");
        }
      }

      function updateSettingsModalTheme(mode) {
        const inner = document.getElementById("settingsModalInner");
        if (!inner) return;
        const isDark = mode === "dark";

        // Modal background & border
        inner.style.background = isDark ? "#1a1a1a" : "#ffffff";
        inner.style.border = isDark
          ? "1px solid rgba(255, 255, 255, 0.08)"
          : "1px solid rgba(0, 0, 0, 0.08)";

        // Header border
        const header = inner.querySelector("div");
        if (header)
          header.style.borderBottom = isDark
            ? "1px solid rgba(255, 255, 255, 0.08)"
            : "1px solid rgba(0, 0, 0, 0.06)";

        // Label colors (language, theme, checkUpdate)
        inner.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (["language", "theme", "checkUpdate"].includes(key)) {
            el.style.color = isDark ? "#d4d4d4" : "#18181b";
          }
        });

        // Check update button
        const checkBtn = document.getElementById("checkUpdateBtn");
        if (checkBtn) {
          checkBtn.style.color = isDark ? "#d4d4d4" : "#18181b";
          checkBtn.onmouseover = function () {
            this.style.background = isDark
              ? "rgba(255,255,255,0.04)"
              : "rgba(0,0,0,0.04)";
          };
          checkBtn.onmouseout = function () {
            this.style.background = "transparent";
          };
        }

        // Version text
        const versionSpan = inner.querySelector('[data-i18n="version"]');
        if (versionSpan && versionSpan.parentElement) {
          versionSpan.parentElement.style.color = isDark
            ? "#71717a"
            : "#a1a1aa";
        }

        // Dividers
        inner.querySelectorAll('[style*="border-top"]').forEach((d) => {
          d.style.borderTop = isDark
            ? "1px solid rgba(255, 255, 255, 0.06)"
            : "1px solid rgba(0, 0, 0, 0.06)";
        });

        // Inactive toggle buttons
        ["lang-zh", "lang-en", "theme-dark", "theme-light"].forEach((id) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          const s = btn.style;
          // Only update if it's the inactive style (transparent bg)
          if (
            s.background === "transparent" ||
            s.backgroundColor === "transparent"
          ) {
            s.border = isDark
              ? "1px solid rgba(255, 255, 255, 0.12)"
              : "1px solid rgba(0, 0, 0, 0.12)";
            s.color = isDark ? "#71717a" : "#a1a1aa";
          }
        });
      }

      // Check for updates
      function checkUpdate() {
        const status = document.getElementById("updateStatus");
        status.textContent = i18n[currentLang].checking;
        status.style.color = "#8b5cf6";

        // Simulate network request
        setTimeout(() => {
          status.textContent = i18n[currentLang].upToDate;
          status.style.color = "#22c55e";
          setTimeout(() => {
            status.textContent = "";
          }, 3000);
        }, 1500);
      }
    </script>
  </body>
</html>
