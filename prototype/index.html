<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence - 原型设计稿</title>
    <style>
      /* ========== Reset & Base ========== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #0b0b0b;
        --bg-tertiary: #101010;
        --border-color: rgba(255, 255, 255, 0.1);
        --border-color-light: rgba(255, 255, 255, 0.08);
        --text-primary: #f5f5f5;
        --text-secondary: #a1a1aa;
        --text-muted: #525252;
        --accent: #8b5cf6;
        --accent-hover: #7c3aed;
        --subtitle-translation-active: #d4d4d4;
        --subtitle-hover-bg: rgba(255, 255, 255, 0.03);
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ========== Layout ========== */
      .app-container {
        display: grid;
        grid-template-columns: 1fr 360px;
        height: 100vh;
        overflow: hidden;
      }

      .app-container.sidebar-closed {
        grid-template-columns: 1fr;
      }

      .app-container.sidebar-closed .sidebar {
        display: none;
      }

      /* ========== Main Area ========== */
      .main-area {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--border-color);
        background: var(--bg-secondary);
      }

      /* ========== Video Area ========== */
      .video-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem 1.5rem 0;
      }

      .video-container {
        position: relative;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid #27272a;
        border-radius: 1rem;
        overflow: hidden;
        flex-shrink: 0;
      }

      .video-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        color: var(--text-muted);
      }

      .video-placeholder svg {
        opacity: 0.4;
      }

      .video-placeholder span {
        font-size: 1rem;
      }

      /* ========== Subtitle Display ========== */
      .subtitle-display {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.25rem 0;
        min-height: 9rem;
      }

      .subtitle-primary {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text-primary);
        max-width: 64rem;
      }

      .subtitle-secondary {
        margin-top: 1.25rem;
        font-size: 1.5rem;
        line-height: 1.4;
        color: var(--text-secondary);
        max-width: 64rem;
      }

      .subtitle-empty {
        font-size: 1.125rem;
        color: var(--text-muted);
      }

      /* ========== Controls Bar ========== */
      .controls-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.25rem;
        height: 3.5rem;
        padding: 0 1rem;
        border-top: 1px solid var(--border-color-light);
        background: var(--bg-secondary);
      }

      .control-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }

      .control-btn.active {
        color: var(--accent);
      }

      .control-btn.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }

      /* ========== Sidebar ========== */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-tertiary);
        transition: box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      /* ========== AI Processing Animation ========== */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes gradient-flow {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 300% 50%;
        }
      }

      .control-btn.ai-processing {
        color: var(--accent) !important;
        opacity: 1 !important;
      }

      .control-btn.ai-processing .load-subtitle-icon {
        display: none;
      }

      .control-btn.ai-processing .load-subtitle-loader {
        display: block !important;
        animation: spin 1s linear infinite;
      }

      /* Sidebar gradient flowing border */
      .sidebar.ai-processing::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        padding: 2px;
        background: linear-gradient(
          90deg,
          #8b5cf6,
          #22c55e,
          #3b82f6,
          #ef4444,
          #8b5cf6
        );
        background-size: 300% 100%;
        animation: gradient-flow 2s linear infinite;
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      /* Sidebar blur overlay */
      .sidebar-overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 5;
        background: var(--ai-overlay-bg, rgba(10, 10, 10, 0.3));
        backdrop-filter: blur(4px);
        pointer-events: none;
        align-items: center;
        justify-content: center;
      }

      .sidebar.ai-processing .sidebar-overlay {
        display: flex;
      }

      .sidebar-overlay-text {
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
        padding: 0.5rem;
      }

      .sidebar.ai-processing {
        box-shadow: none;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 3.5rem;
        padding: 0 2rem;
        border-bottom: 1px solid var(--border-color-light);
        flex-shrink: 0;
      }

      .sidebar-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      .sidebar-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .sidebar-close:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }

      /* ========== Subtitle List ========== */
      .subtitle-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1rem 1.25rem;
        scrollbar-width: thin;
        scrollbar-color: #4b4b4b transparent;
      }

      .subtitle-list::-webkit-scrollbar {
        width: 6px;
      }

      .subtitle-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .subtitle-list::-webkit-scrollbar-thumb {
        background: #4b4b4b;
        border-radius: 3px;
      }

      .subtitle-item {
        display: grid;
        grid-template-columns: 62px 1fr;
        gap: 0.25rem;
        width: 100%;
        padding: 0.5rem 0;
        border: none;
        background: transparent;
        border-radius: 0.375rem;
        text-align: left;
        cursor: pointer;
        transition: all 150ms ease;
        color: var(--text-muted);
      }

      .subtitle-item:hover {
        background: var(--subtitle-hover-bg);
        color: var(--text-secondary);
      }

      .subtitle-item.active {
        color: var(--accent);
      }

      .subtitle-item.active .subtitle-time {
        color: var(--accent);
      }

      .subtitle-item.active .subtitle-translation {
        color: var(--subtitle-translation-active);
      }

      .subtitle-time {
        font-size: 0.875rem;
        font-weight: 700;
        text-align: center;
        color: var(--text-muted);
        transition: color 150ms ease;
      }

      .subtitle-time:hover {
        color: var(--accent);
      }

      .subtitle-text {
        display: block;
        font-size: 0.875rem;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.01em;
      }

      .subtitle-translation {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        line-height: 1.4;
        letter-spacing: -0.01em;
        color: var(--text-muted);
        transition: color 150ms ease;
      }

      .sidebar.blur-primary .subtitle-text {
        filter: blur(4px);
        transition: filter 300ms ease;
      }

      .sidebar.blur-primary .subtitle-item:hover .subtitle-text {
        filter: blur(0);
      }

      .sidebar.blur-secondary .subtitle-translation {
        filter: blur(4px);
        transition: filter 300ms ease;
      }

      .sidebar.blur-secondary .subtitle-item:hover .subtitle-translation {
        filter: blur(0);
      }

      .sidebar.blur-all .subtitle-text,
      .sidebar.blur-all .subtitle-translation {
        filter: blur(4px);
        transition: filter 300ms ease;
      }

      .sidebar.blur-all .subtitle-item:hover .subtitle-text,
      .sidebar.blur-all .subtitle-item:hover .subtitle-translation {
        filter: blur(0);
      }

      .sidebar-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      /* ========== Subtitle Settings Popover ========== */
      .subtitle-settings-wrapper {
        position: relative;
      }

      .subtitle-settings-popover {
        display: none;
        position: absolute;
        bottom: calc(100% + 0.5rem);
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        background: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.625rem;
        padding: 0.375rem;
        z-index: 200;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .subtitle-settings-popover.show {
        display: block;
      }

      .subtitle-settings-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.625rem;
        border-radius: 0.375rem;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        transition: background 150ms ease;
      }

      .subtitle-settings-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .subtitle-settings-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
        color: #d4d4d4;
        white-space: nowrap;
      }

      .subtitle-settings-label svg {
        flex-shrink: 0;
        color: #71717a;
      }

      .subtitle-settings-value {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: #71717a;
        white-space: nowrap;
      }

      .toggle-switch {
        position: relative;
        width: 36px;
        height: 20px;
        background: #3f3f46;
        border-radius: 10px;
        cursor: pointer;
        transition: background 200ms ease;
        flex-shrink: 0;
        border: none;
        padding: 0;
      }

      .toggle-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: #fff;
        border-radius: 50%;
        transition: transform 200ms ease;
      }

      .toggle-switch.active {
        background: var(--accent);
      }

      .toggle-switch.active::after {
        transform: translateX(16px);
      }

      .subtitle-display.blur-primary .subtitle-primary {
        filter: blur(8px);
        transition: filter 300ms ease;
        user-select: none;
      }

      .subtitle-display.blur-secondary .subtitle-secondary {
        filter: blur(8px);
        transition: filter 300ms ease;
        user-select: none;
      }

      .subtitle-display.blur-all .subtitle-primary,
      .subtitle-display.blur-all .subtitle-secondary {
        filter: blur(8px);
        transition: filter 300ms ease;
        user-select: none;
      }

      .subtitle-display.blur-primary:hover .subtitle-primary,
      .subtitle-display.blur-secondary:hover .subtitle-secondary,
      .subtitle-display.blur-all:hover .subtitle-primary,
      .subtitle-display.blur-all:hover .subtitle-secondary {
        filter: blur(0);
      }

      /* ========== Responsive ========== */
      @media (max-width: 1024px) {
        .app-container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main App Container -->
    <div class="app-container" id="app">
      <!-- Main Content Area -->
      <main class="main-area">
        <!-- Video Section -->
        <div class="video-section">
          <!-- Video Player -->
          <div class="video-container">
            <div class="video-placeholder">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              <span data-i18n="videoPlaceholder">选择视频文件开始播放</span>
            </div>
          </div>

          <!-- Subtitle Display Area -->
          <div class="subtitle-display">
            <!-- State 1: With subtitles (default) -->
            <div class="subtitle-content" id="subtitle-content">
              <p class="subtitle-primary">This is your local video player.</p>
              <p class="subtitle-secondary">这是您的本地视频播放器。</p>
            </div>
            <!-- State 2: Empty (hidden by default) -->
            <div
              class="subtitle-content"
              id="subtitle-empty"
              style="display: none"
            >
              <p class="subtitle-empty" data-i18n="noSubtitles">未加载字幕</p>
            </div>
          </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="controls-bar">
          <!-- Open Video Button -->
          <button class="control-btn" data-i18n-title="openVideo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"
              />
            </svg>
          </button>

          <!-- Load Subtitle Button -->
          <button
            id="load-subtitle-btn"
            class="control-btn"
            data-i18n-title="loadSubtitle"
            onclick="triggerAiProcessing()"
          >
            <!-- Original icon -->
            <svg
              class="load-subtitle-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"
              />
              <path d="M14 2v4a2 2 0 0 0 2 2h4" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="13" y2="17" />
            </svg>
            <!-- Loader icon (hidden by default) -->
            <svg
              class="load-subtitle-loader"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display: none"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          </button>

          <!-- Subtitle Settings Button -->
          <div class="subtitle-settings-wrapper">
            <button
              id="subtitle-settings-btn"
              class="control-btn"
              data-i18n-title="subtitleSettings"
              onclick="toggleSubtitlePopover(event)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M7 10h3m-3 4h7" />
                <path
                  d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
                />
              </svg>
            </button>
            <div class="subtitle-settings-popover" id="subtitlePopover">
              <button class="subtitle-settings-item" onclick="toggleSwap()">
                <span class="subtitle-settings-label">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M16 3h5v5" />
                    <path d="M8 3H3v5" />
                    <path d="M12 22v-6" />
                    <path d="M12 8v-2" />
                    <path d="M12 16v-2" />
                    <path d="M21 3 14 10" />
                    <path d="m3 3 7 7" />
                  </svg>
                  <span data-i18n="swapSubtitles">位置切换</span>
                </span>
                <span class="toggle-switch" id="swapToggle"></span>
              </button>
              <button class="subtitle-settings-item" onclick="cycleBlurMode()">
                <span class="subtitle-settings-label">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M10.733 5.076a10.06 10.06 0 0 1 6.535.06" />
                    <path d="M11.204 15.205a10.06 10.06 0 0 1-5.206-3.205" />
                    <path d="M11.5 8.5a10 10 0 0 0-3.5-2" />
                    <path d="M13.5 15.5a10 10 0 0 0 3.5 2" />
                    <path d="M12 12a10 10 0 0 0 0 0" />
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <span data-i18n="blurSubtitles">模糊</span>
                </span>
                <span
                  class="subtitle-settings-value"
                  id="blurModeValue"
                  data-i18n="blurOff"
                  >关闭</span
                >
              </button>
            </div>
          </div>

          <!-- Toggle Sidebar Button -->
          <button
            id="sidebar-toggle-btn"
            class="control-btn active"
            data-i18n-title="subtitlesSidebar"
            onclick="toggleSidebar()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
              />
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
              <path d="M8 10h.01" />
              <path d="M12 10h.01" />
              <path d="M16 10h.01" />
              <path d="M8 14h.01" />
              <path d="M12 14h.01" />
              <path d="M16 14h.01" />
              <path d="M8 18h.01" />
              <path d="M12 18h.01" />
            </svg>
          </button>

          <!-- Settings Button -->
          <button
            class="control-btn"
            data-i18n-title="settings"
            onclick="
              document.getElementById('settingsModal').style.display = 'flex'
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>
      </main>

      <!-- Sidebar (Subtitle List) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-overlay">
          <span class="sidebar-overlay-text" data-i18n="aiProcessing"

    <script>
      // Toggle subtitle settings popover
      function switchSettingsTab(tab) {
        document.querySelectorAll(".settings-tab-panel").forEach((p) => {
          p.style.display = "none";
        });
        const isDark =
          document.documentElement.getAttribute("data-theme") !== "light";
        document.querySelectorAll(".settings-tab").forEach((btn) => {
          const isActive = btn.getAttribute("data-tab") === tab;
          if (isActive) {
            btn.classList.add("active");
            btn.style.background = "rgba(139, 92, 246, 0.12)";
            btn.style.color = "#8b5cf6";
            btn.style.borderLeft = "2px solid #8b5cf6";
          } else {
            btn.classList.remove("active");
            btn.style.background = "transparent";
            btn.style.color = isDark ? "#71717a" : "#a1a1aa";
            btn.style.borderLeft = "2px solid transparent";
          }
        });
        const panel = document.getElementById("tab-" + tab);
        if (panel) panel.style.display = "block";
      }

      function toggleSubtitlePopover(e) {
        e.stopPropagation();
        const popover = document.getElementById("subtitlePopover");
        popover.classList.toggle("show");
      }

      document.addEventListener("click", (e) => {
        const popover = document.getElementById("subtitlePopover");
        const btn = document.getElementById("subtitle-settings-btn");
        if (popover && !popover.contains(e.target) && !btn.contains(e.target)) {
          popover.classList.remove("show");
        }
      });

      function toggleSwap() {
        const toggle = document.getElementById("swapToggle");
        toggle.classList.toggle("active");
        const isSwapped = toggle.classList.contains("active");

        // Swap subtitle display area
        const primary = document.querySelector(".subtitle-primary");
        const secondary = document.querySelector(".subtitle-secondary");
        const tmpText = primary.textContent;
        primary.textContent = secondary.textContent;
        secondary.textContent = tmpText;

        // Swap sidebar items
        const items = document.querySelectorAll(
          ".subtitle-item > span:last-child",
        );
        items.forEach((span) => {
          const text = span.querySelector(".subtitle-text");
          const translation = span.querySelector(".subtitle-translation");
          if (text && translation) {
            const tmp = text.textContent;
            text.textContent = translation.textContent;
            translation.textContent = tmp;
          }
        });
      }

      let currentBlurMode = "off";
      const blurModes = ["off", "primary", "secondary", "all"];

      function cycleBlurMode() {
        const currentIndex = blurModes.indexOf(currentBlurMode);
        const nextIndex = (currentIndex + 1) % blurModes.length;
        const nextMode = blurModes[nextIndex];
        setBlurMode(nextMode);
      }

      function setBlurMode(mode) {
        currentBlurMode = mode;
        const display = document.querySelector(".subtitle-display");
        const sidebar = document.getElementById("sidebar");
        const valueEl = document.getElementById("blurModeValue");

        display.classList.remove("blur-primary", "blur-secondary", "blur-all");
        sidebar.classList.remove("blur-primary", "blur-secondary", "blur-all");

        if (mode === "primary") {
          display.classList.add("blur-primary");
          sidebar.classList.add("blur-primary");
        } else if (mode === "secondary") {
          display.classList.add("blur-secondary");
          sidebar.classList.add("blur-secondary");
        } else if (mode === "all") {
          display.classList.add("blur-all");
          sidebar.classList.add("blur-all");
        }

        const i18nKey =
          mode === "off"
            ? "blurOff"
            : mode === "primary"
              ? "blurPrimaryLine"
              : mode === "secondary"
                ? "blurSecondaryLine"
                : "blurAllLines";
        valueEl.textContent = i18n[currentLang][i18nKey];
        valueEl.setAttribute("data-i18n", i18nKey);
      }

      // Toggle sidebar visibility
      function toggleSidebar() {
        const app = document.getElementById("app");
        const btn = document.getElementById("sidebar-toggle-btn");
        const isClosed = app.classList.toggle("sidebar-closed");
        if (isClosed) {
          btn.classList.remove("active");
        } else {
          btn.classList.add("active");
        }
      }

      // Trigger AI processing animation on button and sidebar
      let aiProcessingTimer = null;
      function triggerAiProcessing() {
        const btn = document.getElementById("load-subtitle-btn");
        const sidebar = document.getElementById("sidebar");
        if (!btn || !sidebar) return;

        // Prevent re-triggering while already processing
        if (btn.classList.contains("ai-processing")) return;

        btn.classList.add("ai-processing", "disabled");
        sidebar.classList.add("ai-processing");

        // Auto-remove after 4 seconds
        aiProcessingTimer = setTimeout(() => {
          btn.classList.remove("ai-processing", "disabled");
          sidebar.classList.remove("ai-processing");
          aiProcessingTimer = null;
        }, 4000);
      }

      // Simulate seeking to subtitle
      function seekToSubtitle(index) {
        const items = document.querySelectorAll(".subtitle-item");
        items.forEach((item, i) => {
          item.classList.toggle("active", i === index);
        });

        // Update subtitle display
        const texts = [
          ["Welcome to Cadence.", "欢迎使用 Cadence。"],
          ["This is your local video player.", "这是您的本地视频播放器。"],
          [
            "Support for SRT and ASS subtitle formats.",
            "支持 SRT 和 ASS 字幕格式。",
          ],
          ["Navigate subtitles with arrow keys.", "使用方向键在字幕间跳转。"],
          ["Hard subtitle masking is supported.", "支持硬字幕遮挡功能。"],
          ["Fine-tune subtitle timing with ease.", "轻松微调字幕时间。"],
          [
            "Built with Tauri, React, and Tailwind CSS.",
            "基于 Tauri、React 和 Tailwind CSS 构建。",
          ],
          ["Enjoy your viewing experience.", "祝您观看愉快。"],
        ];

        const isSwapped = document
          .getElementById("swapToggle")
          .classList.contains("active");
        const primaryText = isSwapped ? texts[index][1] : texts[index][0];
        const secondaryText = isSwapped ? texts[index][0] : texts[index][1];

        document.querySelector(".subtitle-primary").textContent = primaryText;
        document.querySelector(".subtitle-secondary").textContent =
          secondaryText;

        // Scroll active item into view
        items[index].scrollIntoView({ behavior: "smooth", block: "center" });
      }

      // Get current active subtitle index
      function getActiveIndex() {
        const items = document.querySelectorAll(".subtitle-item");
        for (let i = 0; i < items.length; i++) {
          if (items[i].classList.contains("active")) return i;
        }
        return null;
      }

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          const items = document.querySelectorAll(".subtitle-item");
          if (items.length === 0) return;

          let idx = getActiveIndex();
          if (idx === null) idx = 0;

          if (e.key === "ArrowLeft") {
            idx = Math.max(0, idx - 1);
          } else {
            idx = Math.min(items.length - 1, idx + 1);
          }

          seekToSubtitle(idx);
        }
      });

      let currentLang = "zh";

      function applyLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];

        // Update text content
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) el.textContent = t[key];
        });

        // Update title attributes
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.getAttribute("data-i18n-title");
          if (t[key]) el.setAttribute("title", t[key]);
        });

        // Update lang button texts
        const zhBtn = document.getElementById("lang-zh");
        const enBtn = document.getElementById("lang-en");
        if (zhBtn) zhBtn.textContent = t.langZh;
        if (enBtn) enBtn.textContent = t.langEn;

        // Update theme button texts
        const darkBtn = document.getElementById("theme-dark");
        const autoBtn = document.getElementById("theme-auto");
        const lightBtn = document.getElementById("theme-light");
        if (darkBtn) {
          darkBtn.childNodes[darkBtn.childNodes.length - 1].textContent =
            " " + t.themeDark;
        }
        if (autoBtn) {
          autoBtn.childNodes[autoBtn.childNodes.length - 1].textContent =
            " " + t.themeAuto;
        }
        if (lightBtn) {
          lightBtn.childNodes[lightBtn.childNodes.length - 1].textContent =
            " " + t.themeLight;
        }

        // Update check update status text if visible
        const status = document.getElementById("updateStatus");
        if (status) {
          if (
            status.textContent === "检查中..." ||
            status.textContent === "Checking..."
          ) {
            status.textContent = t.checking;
          } else if (
            status.textContent === "已是最新版本" ||
            status.textContent === "Up to date"
          ) {
            status.textContent = t.upToDate;
          }
        }
      }

      // Switch language
      function switchLang(lang) {
        const zhBtn = document.getElementById("lang-zh");
        const enBtn = document.getElementById("lang-en");

        if (lang === "zh") {
          zhBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          enBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        } else {
          zhBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
          enBtn.style.cssText =
            "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        }

        applyLanguage(lang);
      }

      // Current theme mode: "dark", "light", or "auto"
      let currentTheme = "dark";

      // Apply CSS variables for a given effective mode ("dark" or "light")
      function applyThemeVars(mode) {
        const root = document.documentElement;
        if (mode === "dark") {
          root.style.setProperty("--bg-primary", "#0a0a0a");
          root.style.setProperty("--bg-secondary", "#0b0b0b");
          root.style.setProperty("--bg-tertiary", "#101010");
          root.style.setProperty("--border-color", "rgba(255, 255, 255, 0.1)");
          root.style.setProperty(
            "--border-color-light",
            "rgba(255, 255, 255, 0.08)",
          );
          root.style.setProperty("--text-primary", "#f5f5f5");
          root.style.setProperty("--text-secondary", "#a1a1aa");
          root.style.setProperty("--text-muted", "#525252");
          root.style.setProperty("--subtitle-translation-active", "#d4d4d4");
          root.style.setProperty(
            "--subtitle-hover-bg",
            "rgba(255, 255, 255, 0.03)",
          );
          root.style.setProperty("--ai-overlay-bg", "rgba(10, 10, 10, 0.3)");
          root.setAttribute("data-theme", "dark");
        } else {
          root.style.setProperty("--bg-primary", "#fafafa");
          root.style.setProperty("--bg-secondary", "#ffffff");
          root.style.setProperty("--bg-tertiary", "#f4f4f5");
          root.style.setProperty("--border-color", "rgba(0, 0, 0, 0.1)");
          root.style.setProperty("--border-color-light", "rgba(0, 0, 0, 0.06)");
          root.style.setProperty("--text-primary", "#18181b");
          root.style.setProperty("--text-secondary", "#525252");
          root.style.setProperty("--text-muted", "#a1a1aa");
          root.style.setProperty("--subtitle-translation-active", "#3f3f46");
          root.style.setProperty("--subtitle-hover-bg", "rgba(0, 0, 0, 0.04)");
          root.style.setProperty("--ai-overlay-bg", "rgba(255, 255, 255, 0.5)");
          root.setAttribute("data-theme", "light");
        }
        updateSettingsModalTheme(mode);
        updateSubtitlePopoverTheme(mode);
      }

      // Resolve effective theme for auto mode
      function resolveEffectiveTheme() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      // Switch theme
      function switchTheme(theme) {
        currentTheme = theme;
        const autoBtn = document.getElementById("theme-auto");
        const darkBtn = document.getElementById("theme-dark");
        const lightBtn = document.getElementById("theme-light");

        // Shared inactive button style
        const baseInactive =
          "padding: 0.25rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); background: transparent; color: #71717a; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        const inactiveLeft =
          baseInactive + " border-radius: 0.375rem 0 0 0.375rem;";
        const inactiveRight =
          baseInactive + " border-radius: 0 0.375rem 0.375rem 0;";

        // Active button styles (by position)
        const activeLeft =
          "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0.375rem 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        const activeMiddle =
          "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";
        const activeRight =
          "padding: 0.25rem 0.75rem; border: 1px solid #8b5cf6; background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-radius: 0 0.375rem 0.375rem 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 150ms ease;";

        if (theme === "auto") {
          autoBtn.style.cssText = activeLeft;
          darkBtn.style.cssText = baseInactive;
          lightBtn.style.cssText = inactiveRight;
          applyThemeVars(resolveEffectiveTheme());
        } else if (theme === "dark") {
          autoBtn.style.cssText = inactiveLeft;
          darkBtn.style.cssText = activeMiddle;
          lightBtn.style.cssText = inactiveRight;
          applyThemeVars("dark");
        } else if (theme === "light") {
          autoBtn.style.cssText = inactiveLeft;
          darkBtn.style.cssText = baseInactive;
          lightBtn.style.cssText = activeRight;
          applyThemeVars("light");
        }
      }

      // Listen for system theme changes when in auto mode
      const systemThemeMedia = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      systemThemeMedia.addEventListener("change", () => {
        if (currentTheme === "auto") {
          applyThemeVars(resolveEffectiveTheme());
        }
      });

      function updateSettingsModalTheme(mode) {
        const inner = document.getElementById("settingsModalInner");
        if (!inner) return;
        const isDark = mode === "dark";

        // Modal background & border
        inner.style.background = isDark ? "#1a1a1a" : "#ffffff";
        inner.style.border = isDark
          ? "1px solid rgba(255, 255, 255, 0.08)"
          : "1px solid rgba(0, 0, 0, 0.08)";

        // Header border
        const header = inner.querySelector("div");
        if (header)
          header.style.borderBottom = isDark
            ? "1px solid rgba(255, 255, 255, 0.08)"
            : "1px solid rgba(0, 0, 0, 0.06)";

        // Label colors (language, theme, checkUpdate)
        inner.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (["language", "theme", "checkUpdate"].includes(key)) {
            el.style.color = isDark ? "#d4d4d4" : "#18181b";
          }
        });

        // Check update button
        const checkBtn = document.getElementById("checkUpdateBtn");
        if (checkBtn) {
          checkBtn.style.color = isDark ? "#d4d4d4" : "#18181b";
          checkBtn.onmouseover = function () {
            this.style.background = isDark
              ? "rgba(255,255,255,0.04)"
              : "rgba(0,0,0,0.04)";
          };
          checkBtn.onmouseout = function () {
            this.style.background = "transparent";
          };
        }

        // Version text
        const versionSpan = inner.querySelector('[data-i18n="version"]');
        if (versionSpan && versionSpan.parentElement) {
          versionSpan.parentElement.style.color = isDark
            ? "#71717a"
            : "#a1a1aa";
        }

        // Dividers
        inner.querySelectorAll('[style*="border-top"]').forEach((d) => {
          d.style.borderTop = isDark
            ? "1px solid rgba(255, 255, 255, 0.06)"
            : "1px solid rgba(0, 0, 0, 0.06)";
        });

        // Inactive toggle buttons
        [
          "lang-zh",
          "lang-en",
          "theme-dark",
          "theme-auto",
          "theme-light",
        ].forEach((id) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          const s = btn.style;
          // Only update if it's the inactive style (transparent bg)
          if (
            s.background === "transparent" ||
            s.backgroundColor === "transparent"
          ) {
            s.border = isDark
              ? "1px solid rgba(255, 255, 255, 0.12)"
              : "1px solid rgba(0, 0, 0, 0.12)";
            s.color = isDark ? "#71717a" : "#a1a1aa";
          }
        });

        // Tab sidebar border
        const tabSidebar = document.getElementById("settingsTabs");
        if (tabSidebar) {
          tabSidebar.style.borderRight = isDark
            ? "1px solid rgba(255, 255, 255, 0.08)"
            : "1px solid rgba(0, 0, 0, 0.06)";
        }

        // Inactive tab buttons
        document.querySelectorAll(".settings-tab").forEach((btn) => {
          if (!btn.classList.contains("active")) {
            btn.style.color = isDark ? "#71717a" : "#a1a1aa";
          }
        });

        // AI coming soon text
        const aiText = inner.querySelector('[data-i18n="aiComingSoon"]');
        if (aiText) {
          aiText.style.color = isDark ? "#71717a" : "#a1a1aa";
        }

        // DeepSeek config section header
        const deepseekHeader = inner.querySelector(
          '[data-i18n="deepseekConfig"]',
        );
        if (deepseekHeader) {
          deepseekHeader.style.color = isDark ? "#d4d4d4" : "#18181b";
        }

        // Form labels
        inner.querySelectorAll("label").forEach((label) => {
          label.style.color = isDark ? "#a1a1aa" : "#71717a";
        });

        // Input fields and select
        inner.querySelectorAll("input, select").forEach((input) => {
          input.style.borderColor = isDark
            ? "rgba(255, 255, 255, 0.12)"
            : "rgba(0, 0, 0, 0.12)";
          input.style.background = isDark
            ? "rgba(255, 255, 255, 0.04)"
            : "rgba(0, 0, 0, 0.02)";
          input.style.color = isDark ? "#d4d4d4" : "#18181b";

          // Also update option element backgrounds for select dropdowns
          if (input.tagName === "SELECT") {
            input.querySelectorAll("option").forEach((opt) => {
              opt.style.background = isDark ? "#1a1a1a" : "#ffffff";
              opt.style.color = isDark ? "#d4d4d4" : "#18181b";
            });
          }
        });
      }

      function updateSubtitlePopoverTheme(mode) {
        const popover = document.getElementById("subtitlePopover");
        if (!popover) return;
        const isDark = mode === "dark";

        popover.style.background = isDark ? "#1a1a1a" : "#ffffff";
        popover.style.border = isDark
          ? "1px solid rgba(255, 255, 255, 0.1)"
          : "1px solid rgba(0, 0, 0, 0.1)";
        popover.style.boxShadow = isDark
          ? "0 8px 24px rgba(0, 0, 0, 0.4)"
          : "0 8px 24px rgba(0, 0, 0, 0.15)";

        popover.querySelectorAll(".subtitle-settings-item").forEach((item) => {
          item.onmouseover = function () {
            this.style.background = isDark
              ? "rgba(255,255,255,0.04)"
              : "rgba(0,0,0,0.04)";
          };
          item.onmouseout = function () {
            this.style.background = "transparent";
          };
        });

        popover
          .querySelectorAll(".subtitle-settings-label")
          .forEach((label) => {
            label.style.color = isDark ? "#d4d4d4" : "#18181b";
            const svg = label.querySelector("svg");
            if (svg) svg.style.color = isDark ? "#71717a" : "#a1a1aa";
          });

        const valueEl = document.getElementById("blurModeValue");
        if (valueEl) {
          valueEl.style.color = isDark ? "#71717a" : "#a1a1aa";
        }

        const swapToggle = document.getElementById("swapToggle");
        if (swapToggle) {
          swapToggle.style.background = swapToggle.classList.contains("active")
            ? "var(--accent)"
            : isDark
              ? "#3f3f46"
              : "#d4d4d4";
        }
      }

      // Save DeepSeek configuration
      function saveDeepSeekConfig() {
        const apiKey = document.getElementById("deepseek-api-key").value;
        const model = document.getElementById("deepseek-model").value;

        // In a real app, this would save to localStorage or a config file
        console.log("DeepSeek Config:", { apiKey, model });

        // Show a brief confirmation (could be replaced with a toast notification)
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = currentLang === "zh" ? "已保存 ✓" : "Saved ✓";
        btn.style.background = "#22c55e";
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = "#8b5cf6";
        }, 1500);
      }

      // Check for updates
      function checkUpdate() {
        const status = document.getElementById("updateStatus");
        status.textContent = i18n[currentLang].checking;
        status.style.color = "#8b5cf6";

        // Simulate network request
        setTimeout(() => {
          status.textContent = i18n[currentLang].upToDate;
          status.style.color = "#22c55e";
          setTimeout(() => {
            status.textContent = "";
          }, 3000);
        }, 1500);
      }
    </script>
  </body>
</html>
